name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - daily_dev

permissions:
  contents: read

jobs:
  dependency-security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:prod:baseline

  mini:
    name: Mini program checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:upgrade

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "services/api[dev]"
      - run: python -m ruff format --check services/api
      - run: python -m ruff check services/api
      - run: python -m mypy services/api/src
      - run: python -m pytest services/api/tests
